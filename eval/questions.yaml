# Evaluation set for the knowledge assistant (form questions 52 and 55).
# Run before launch and after every change of model, prompt, embedding model or corpus:
#   python -m ska eval            (full run, calls Claude Haiku, about $0.03)
#   python -m ska eval --retrieval-only   (free: retrieval, access and version checks only)
#
# Fields
#   user:      who asks (config/users.yaml). Roles come from the user, never from the text.
#   type:      answerable | not_in_docs | access_denied | injection | conflict | history
#   expect:    answer | refuse | any        (what the assistant should do)
#   docs:      gold documents; a hit means any of them is retrieved / cited
#   section:   gold section of the first gold doc (optional)
#   version:   the version the answer must use (optional)
#   include:   strings the answer must contain; "a|b" means either a or b
#   exclude:   strings the answer must NOT contain (old figures, leaked values)
#   forbidden: documents this user may not see; citing or retrieving them is a leak
#   preferred: for conflicts, the document that must win
#   style:     msa | dialect | en

items:
# ---------------------------------------------------------------- answerable (crew)
